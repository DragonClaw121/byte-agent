# Uso (na raiz do projeto):  cp .env.example .env  &&  docker compose -f deploy/docker-compose.yml up -d --build
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    # GPU NVIDIA (requer nvidia-container-toolkit no host): descomente o bloco abaixo.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  byte:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      - ollama
    volumes:
      - byte_data:/data
    ports:
      # Só na interface local do servidor: o painel permite executar código. Acesse por túnel SSH ou Tailscale.
      - "127.0.0.1:8765:8765"

volumes:
  ollama_models:
  byte_data:
