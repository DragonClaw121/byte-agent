# Vários agentes, o mesmo código: cada serviço sobe um manifesto, com pasta e porta próprias.
# Uso (na raiz do projeto):  docker compose -f deploy/docker-compose.agentes.yml up -d --build
# Segredos (tokens) vão no .env com os NOMES usados nos manifestos (ex.: KRONUS_API_TOKEN, BIT_TELEGRAM_TOKEN).
# A VTuber (agente "byte") depende do VTube Studio e do áudio do seu computador: rode-a localmente, não aqui.
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama

  bit:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    env_file: ../.env
    environment: { OLLAMA_URL: "http://ollama:11434" }
    command: ["python", "-m", "byte_agent", "--agent", "bit", "--data-dir", "/data/bit", "--host", "0.0.0.0"]
    volumes: ["../agents:/app/agents:ro", "agentes_dados:/data"]   # ./agents: seus manifestos (têm prioridade)
    ports: ["127.0.0.1:8771:8771"]
    depends_on: [ollama]

  kronus:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    env_file: ../.env
    environment: { OLLAMA_URL: "http://ollama:11434" }
    command: ["python", "-m", "byte_agent", "--agent", "kronus", "--data-dir", "/data/kronus", "--host", "0.0.0.0"]
    volumes: ["../agents:/app/agents:ro", "agentes_dados:/data"]   # ./agents: seus manifestos (têm prioridade)
    # Só local: para o relógio/celular, publique a porta por um túnel com HTTPS (Tailscale, Cloudflare Tunnel).
    ports: ["127.0.0.1:8772:8772"]
    depends_on: [ollama]

volumes:
  ollama_models:
  agentes_dados:
