name: app-android
# Compila os apps Android e publica em "Releases", sempre nos mesmos endereços:
# Kronus (o seu):          https://github.com/DragonClaw121/byte-agent/releases/download/app-kronus/kronus.apk
# Meu Assistente (para convidados, v13.46): .../releases/download/app-assistente/assistente.apk
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Chave de assinatura (segredo do repositório)
        env:
          KRONUS_KEYSTORE_B64: ${{ secrets.KRONUS_KEYSTORE_B64 }}
        run: |
          if [ -n "$KRONUS_KEYSTORE_B64" ]; then
            printf '%s' "$KRONUS_KEYSTORE_B64" | base64 -d > android/app/kronus.p12
            echo "Assinando com a chave dos segredos."
          else
            echo "::error::Falta o segredo KRONUS_KEYSTORE_B64 (rode scripts/chave-app.sh no Cloud Shell)."; exit 1
          fi
      - name: Compilar
        working-directory: android
        env:
          KRONUS_KEYSTORE_SENHA: ${{ secrets.KRONUS_KEYSTORE_SENHA }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Apagar a chave do disco
        if: always()
        run: rm -f android/app/kronus.p12
      - name: Publicar o APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk kronus.apk
          gh release delete app-kronus --yes --cleanup-tag || true
          gh release create app-kronus kronus.apk --target "$GITHUB_SHA" --title "App Kronus para Android (build $GITHUB_RUN_NUMBER)" \
            --notes "Baixe kronus.apk no celular e instale (permita instalar de fontes desconhecidas). Cada build novo atualiza o app por cima."
          cp android/assistente/build/outputs/apk/release/assistente-release.apk assistente.apk
          gh release delete app-assistente --yes --cleanup-tag || true
          gh release create app-assistente assistente.apk --target "$GITHUB_SHA" --title "App Meu Assistente para Android (build $GITHUB_RUN_NUMBER)" \
            --notes "App para quem foi convidado para um agente. Instale, abra e cole o link do seu painel pessoal (peça /painel)."
