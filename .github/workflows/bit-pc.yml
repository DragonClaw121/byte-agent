name: bit-pc
# Gera o app do Bit para Windows (BitPC.exe) num Windows de verdade, testa (captura de tela + janelas) e publica em
# "Releases", sempre no mesmo endereço:
# https://github.com/DragonClaw121/byte-agent/releases/download/app-bit-pc/BitPC.exe
on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/bit-pc.yml"]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write          # atestado de origem (o .exe foi gerado por este CI, a partir deste commit)
  attestations: write
jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: |
          python -m pip install --disable-pip-version-check mss==9.0.2 pillow==11.0.0 olefile==0.47 PyAudioWPatch==0.2.12.9 pyinstaller==6.11.1
          mkdir fotos
      - name: Autoteste em Python (janela, avisos, modo compacto, ajuda ao vivo) em 100% e 150%
        shell: pwsh
        run: |
          python desktop/bit_pc.py --autoteste fotos\autoteste-100.json
          $a = $LASTEXITCODE
          Get-Content fotos\autoteste-100.json
          $env:BITPC_ESCALA_TESTE = "1.5"
          python desktop/bit_pc.py --autoteste fotos\autoteste-150.json
          $b = $LASTEXITCODE
          Get-Content fotos\autoteste-150.json
          if ($a -ne 0 -or $b -ne 0) { exit 1 }
      - name: Instalador (Python oficial por usuário + app + atalhos) e autoteste do app instalado
        shell: pwsh
        env:
          BITPC_ORIGEM: ${{ github.workspace }}\desktop
          BITPC_NAO_ABRIR: "1"
        run: |
          & .\desktop\instalar.ps1
          $py = Join-Path $env:LOCALAPPDATA "Programs\Python\Python312\python.exe"
          if (-not (Test-Path $py)) { throw "Python não foi instalado" }
          $lnk = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Bit no PC.lnk"
          if (-not (Test-Path $lnk)) { throw "Atalho não foi criado" }
          & $py (Join-Path $env:LOCALAPPDATA "BitPC\bit_pc.py") --autoteste instalado.json
          $code = $LASTEXITCODE
          Get-Content instalado.json
          exit $code
      - name: Fotos do autoteste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fotos-bit-pc
          path: fotos/
          retention-days: 7
      - name: PyInstaller com o carregador compilado aqui (menos alarme falso de antivírus)
        shell: pwsh
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          # o carregador pronto do PyInstaller é o mesmo de muito malware, e por isso vários antivírus o marcam;
          # compilado aqui, ele é único. Se a compilação falhar, segue com o pronto (e avisa).
          python -m pip uninstall -y pyinstaller
          python -m pip install --disable-pip-version-check --no-binary pyinstaller pyinstaller==6.11.1
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::warning::Não consegui compilar o carregador do PyInstaller; usando o pronto."
            python -m pip install --disable-pip-version-check pyinstaller==6.11.1
          }
      - name: Informações de versão do .exe
        shell: python
        run: |
          import re
          v = re.search(r'^VERSION = "([\d.]+)"', open("desktop/bit_pc.py", encoding="utf-8").read(), re.M).group(1)
          nums = (v.split(".") + ["0", "0", "0"])[:4]
          tup = "(" + ", ".join(nums) + ")"
          info = f"""VSVersionInfo(
            ffi=FixedFileInfo(filevers={tup}, prodvers={tup}, mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1,
                              subtype=0x0, date=(0, 0)),
            kids=[StringFileInfo([StringTable('041604B0', [
                StringStruct('CompanyName', 'Projeto Byte'),
                StringStruct('FileDescription', 'Bit no PC - assistente de trabalho'),
                StringStruct('FileVersion', '{v}'),
                StringStruct('InternalName', 'BitPC'),
                StringStruct('LegalCopyright', 'Projeto Byte'),
                StringStruct('OriginalFilename', 'BitPC.exe'),
                StringStruct('ProductName', 'Bit no PC'),
                StringStruct('ProductVersion', '{v}')])]),
                  VarFileInfo([VarStruct('Translation', [1046, 1200])])])
          """
          open("versao.txt", "w", encoding="utf-8").write(info)
          print(info)
      - name: Gerar BitPC.exe
        run: pyinstaller --noconfirm --onefile --noconsole --noupx --name BitPC --icon desktop/bit.ico --version-file versao.txt desktop/bit_pc.py
      - name: Autoteste do .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\BitPC.exe -ArgumentList "--autoteste","exe.json" -Wait -PassThru
          Get-Content exe.json
          exit $p.ExitCode
      - name: SHA-256 do .exe
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\BitPC.exe -Algorithm SHA256).Hash.ToLower()
          "$h  BitPC.exe" | Out-File -Encoding ascii -NoNewline dist\BitPC.exe.sha256
          Write-Output "SHA-256: $h"
      - name: Atestado de origem (GitHub)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/BitPC.exe
      - name: Publicar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Atualiza a release existente (não apaga antes: se o GitHub falhar no meio, o link antigo continua valendo),
          # tenta de novo em erro temporário (5xx) e só termina quando o link público do BitPC.exe existe de verdade.
          set +e +o pipefail                                  # um 5xx do GitHub não pode encerrar o passo na 1ª tentativa
          TITLE="Bit no PC para Windows (build $GITHUB_RUN_NUMBER)"
          SHA=$(cut -d' ' -f1 dist/BitPC.exe.sha256)
          NOTES="Baixe BitPC.exe e abra. Na primeira vez o Windows pode avisar 'O Windows protegeu o computador' (o app não é assinado): Mais informações → Executar assim mesmo. Depois, mande /pc para o Bit no Telegram e cole o link no app.

          Sem alarme de antivírus: instale pelo PowerShell (sem .exe), veja docs/bit-pc.md.

          Conferir que este arquivo é o original:
          - SHA-256: $SHA (no PowerShell: Get-FileHash BitPC.exe)
          - Origem (gerado pelo CI deste repositório, commit $GITHUB_SHA): gh attestation verify BitPC.exe --repo $GITHUB_REPOSITORY
          - Análise de antivírus: https://www.virustotal.com/gui/file/$SHA"
          # rascunhos deixados por uma falha anterior do GitHub atrapalham: saem
          gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft and .tag_name=="app-bit-pc") | .id' \
            | while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" || true; done
          for i in 1 2 3 4 5 6 7 8; do
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/app-bit-pc" >/dev/null 2>&1; then
              gh release upload app-bit-pc dist/BitPC.exe dist/BitPC.exe.sha256 --clobber && gh release edit app-bit-pc --title "$TITLE" --notes "$NOTES" --draft=false
            else
              gh release create app-bit-pc dist/BitPC.exe dist/BitPC.exe.sha256 --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" \
                || gh release edit app-bit-pc --draft=false
            fi
            sleep 5
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/app-bit-pc" --jq '.assets[].name' 2>/dev/null | grep -qx BitPC.exe; then
              echo "Publicado: https://github.com/$GITHUB_REPOSITORY/releases/download/app-bit-pc/BitPC.exe"
              exit 0
            fi
            echo "GitHub falhou (tentativa $i); tentando de novo..."
            sleep $((i * 15))
          done
          exit 1
