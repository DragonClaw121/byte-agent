plugins {
    id 'com.android.application'
}

// Número do build no GitHub Actions vira a versão: cada APK novo atualiza o anterior sem desinstalar.
def runNumber = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')

android {
    namespace 'io.byteagent.kronus'
    compileSdk 35

    defaultConfig {
        applicationId 'io.byteagent.kronus'
        minSdk 26
        targetSdk 35
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // Assinatura: a chave fica SÓ nos segredos do GitHub (KRONUS_KEYSTORE_B64 + KRONUS_KEYSTORE_SENHA), gerada por
    // scripts/chave-app.sh. O workflow grava a chave em kronus.p12 antes de compilar e apaga depois.
    def novaChave = file('kronus.p12')
    def senha = System.getenv('KRONUS_KEYSTORE_SENHA') ?: ''
    signingConfigs {
        kronus {
            if (novaChave.exists() && !senha.isEmpty()) {
                storeFile novaChave
                storeType 'pkcs12'
                storePassword senha
                keyAlias 'kronus'
                keyPassword senha
            }
        }
    }
    // Sem a chave (compilação no seu PC): assina com a chave de depuração do próprio Android Studio.
    def assinar = (novaChave.exists() && !senha.isEmpty()) ? signingConfigs.kronus : signingConfigs.debug
    buildTypes {
        release {
            minifyEnabled false
            signingConfig assinar
        }
        debug {
            signingConfig assinar
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
